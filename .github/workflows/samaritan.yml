name: Samaritan Auto-Poster

on:
  schedule:
    # ATTENZIONE: queste NON sono le ore di pubblicazione. GitHub fa partire le
    # run schedulate in ritardo, da un'ora a tre e mezza, e il ritardo non si
    # puo' prevedere. Quindi la pipeline parte con molto anticipo e il video
    # esce all'ora giusta perche' YouTube lo pubblica da solo (publishAt, vedi
    # orari.py). Cambiando questi cron si sposta solo il margine; per cambiare
    # l'ora di uscita si cambia ORARIO_USCITA piu' sotto.
    - cron: '30 7 * * *'          # per l'uscita delle 14:00 italiane
    - cron: '30 11 * * *'         # per l'uscita delle 18:00 italiane
    - cron: '30 14 * * *'         # per l'uscita delle 21:00, in inglese
    # La riserva di fine giornata. Non produce un video suo: guarda quali
    # delle tre uscite di oggi sono rimaste scoperte e rifa' la piu' vecchia,
    # una sola. Se sono tutte a posto termina subito senza fare niente.
    - cron: '30 20 * * *'         # riserva, verso le 22:30 italiane
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema specifico (lascia vuoto per tema libero)'
        required: false
        default: ''
      privacy:
        description: 'Visibilita del video'
        required: false
        default: 'public'
        type: choice
        options: [public, private, unlisted]
      lingua:
        description: 'Lingua del video'
        required: false
        default: 'it'
        type: choice
        options: [it, en]
      recupero:
        description: 'Recupera un video saltato invece di farne uno nuovo'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: samaritan-publish
  cancel-in-progress: false

jobs:
  produci-e-pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa FFmpeg e font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache modello Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ vars.WHISPER_MODEL || 'base' }}

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le credenziali OAuth NON stanno nel repository (sono in .gitignore).
      # Arrivano dai Secrets come base64 e vivono solo per la durata del job.
      - name: Ripristina credenziali YouTube
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          if [ -z "$CLIENT_SECRET_B64" ] || [ -z "$YOUTUBE_TOKEN_B64" ]; then
            echo "::error::Mancano i secret CLIENT_SECRET_B64 e/o YOUTUBE_TOKEN_B64."
            echo "Generali in locale con: python setup_secrets.py"
            exit 1
          fi
          echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > token.pickle

      - name: Esegui pipeline Samaritan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIVACY_STATUS: ${{ inputs.privacy || 'public' }}
          # Un orario di uscita per ciascun cron. La riserva e le run lanciate
          # a mano non programmano niente: escono subito, com'e' giusto sia
          # per una prova sia per un'uscita gia' saltata.
          ORARIO_USCITA: ${{ (github.event.schedule == '30 7 * * *' && '14:00') || (github.event.schedule == '30 11 * * *' && '18:00') || (github.event.schedule == '30 14 * * *' && '21:00') || '' }}
          FUSO_USCITA: 'Europe/Rome'
          # Quale uscita sta coprendo questa lavorazione. Sui tre cron normali
          # e' lo stesso valore di ORARIO_USCITA, ma i due campi non sono la
          # stessa cosa: ORARIO_USCITA dice a YouTube quando mostrare il video,
          # SLOT serve a non farne due per la stessa uscita quando una
          # lavorazione arriva in ritardo. Sulla riserva resta vuoto: quale
          # uscita recuperare lo decide lei leggendo la cronologia.
          SLOT: ${{ (github.event.schedule == '30 7 * * *' && '14:00') || (github.event.schedule == '30 11 * * *' && '18:00') || (github.event.schedule == '30 14 * * *' && '21:00') || '' }}
          RECUPERO: ${{ (github.event.schedule == '30 20 * * *' && '1') || (inputs.recupero && '1') || '' }}
          # Il video delle 21:00 e' in inglese: stesso canale, pubblico
          # diverso. Le run lanciate a mano scelgono dal menu.
          LINGUA: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 14 * * *' && 'en' || 'it') || inputs.lingua || 'it' }}
          NOME_CANALE: ${{ vars.NOME_CANALE || 'Poppone TV' }}
          # Le parentesi contano: in GitHub Actions && lega piu' di ||,
          # e senza di quelle l'espressione restituisce 'true' invece del
          # nome della voce.
          VOCE_TTS: ${{ ((github.event_name == 'schedule' && github.event.schedule == '30 14 * * *') || (inputs.lingua == 'en')) && (vars.VOCE_TTS_EN || 'en-US-AndrewNeural') || (vars.VOCE_TTS || 'it-IT-DiegoNeural') }}
          # La riserva sceglie la lingua solo a lavorazione iniziata, quindi
          # le servono tutt'e due le voci gia' pronte.
          VOCE_TTS_IT: ${{ vars.VOCE_TTS || 'it-IT-DiegoNeural' }}
          VOCE_TTS_EN: ${{ vars.VOCE_TTS_EN || 'en-US-AndrewNeural' }}
          ELEVENLABS_VOCE: ${{ vars.ELEVENLABS_VOCE }}
          ELEVENLABS_MODELLO: ${{ vars.ELEVENLABS_MODELLO }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base' }}
          GROQ_MODELLI: ${{ vars.GROQ_MODELLI }}
          # Passato via env e non interpolato nel comando: evita script injection
          TEMA: ${{ inputs.tema }}
        run: python main.py "$TEMA"

      - name: Cancella le credenziali dal runner
        if: always()
        run: rm -f client_secret.json token.pickle

      - name: Salva memoria e performance
        if: always()
        run: |
          git config --global user.name "Samaritan Bot"
          git config --global user.email "bot@samaritan.local"

          # Un file alla volta, e MAI due percorsi nello stesso 'git add':
          # se uno dei due non esiste, git fallisce senza mettere in stage
          # nemmeno l'altro. performance.json nasce solo quando YouTube
          # Analytics risponde, quindi all'inizio non c'e': e' per questo che
          # la memoria non veniva mai salvata.
          for file_memoria in cronologia_trend.json performance.json; do
            if [ -f "$file_memoria" ]; then
              git add -- "$file_memoria"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nessuna modifica alla memoria da salvare."
            exit 0
          fi

          git commit -m "Aggiornamento memoria Samaritan [skip ci]"

          # Il push puo' essere rifiutato se il branch e' avanzato nel
          # frattempo: riallineo e riprovo una volta sola.
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          echo "Push rifiutato, riallineo sulla base remota e riprovo."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Conserva il video prodotto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samaritan-short
          path: output_videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore
