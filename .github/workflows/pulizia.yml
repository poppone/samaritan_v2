name: Pulizia copie dei video

# Il repository e' privato: GitHub gratis tiene 500 MB fra tutti gli
# artifact, e le copie dei video montati li riempivano (ottobre 2026).
# I video veri stanno su YouTube; qui si cancellano le copie con piu' di un
# giorno. Gira da sola ogni notte e si puo' lanciare a mano.

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: samaritan-pulizia
  cancel-in-progress: false

jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancella le copie con piu' di un giorno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limite=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$limite\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "Cancellata copia $id"
              done
