name: Test

# Samaritan pubblica da solo, di notte, senza nessuno a guardare: la rete di
# sicurezza sulla logica deve girare a ogni push e a ogni pull request.
# Solo sulle pull request (e a mano): girare a ogni push, compresi quelli del
# bot che salva la memoria, costava circa 450 minuti al mese di Actions.
# Tutto il codice entra in main da una PR, quindi i test girano lo stesso
# prima di ogni modifica vera.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa le dipendenze dei test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Esegui i test
        run: python -m pytest tests/ -v

      # Ha gia' intercettato un conflitto reale: moviepy 2.x non accetta
      # Pillow 12. Meglio scoprirlo qui che alle 20:00, a video da pubblicare.
      - name: Verifica che requirements.txt sia installabile
        run: pip install --dry-run -r requirements.txt

  sonda-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # I pacchetti di FFmpeg si tengono in cache: il mirror Ubuntu dei runner
      # a volte li scarica in 20-40 minuti e la lavorazione sfora i 45 minuti
      # (27 ottobre: un video su GTA VI perso cosi'). La chiave cambia ogni
      # mese, cosi' i pacchetti restano allineati agli aggiornamenti di Ubuntu.
      - name: Mese per la cache di FFmpeg
        id: mese
        run: echo "mese=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache pacchetti FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-${{ runner.os }}-${{ steps.mese.outputs.mese }}
          restore-keys: apt-ffmpeg-${{ runner.os }}-

      - name: Installa FFmpeg e font
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y \
            -o Dir::Cache::Archives="$HOME/apt-cache" \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 \
            ffmpeg fonts-dejavu-core
          # apt lascia file di root che la cache non riuscirebbe a leggere.
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
          du -sh ~/apt-cache

      - name: Verifica
        run: |
          ffmpeg -version | head -1; ffprobe -version | head -1
          ls ~/apt-cache | wc -l  # secondo giro
