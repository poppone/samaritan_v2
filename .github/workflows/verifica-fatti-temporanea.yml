# TEMPORANEO: prova la verifica dei fatti con Groq vero. Da togliere prima
# di unire la PR.
name: Verifica fatti (temporanea)
on:
  push:
    branches: [claude/project-thread-1sanb4]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Sonda sommari
        run: |
          python - <<'PY'
          import requests, re, html
          import xml.etree.ElementTree as ET
          H = {"User-Agent": "Mozilla/5.0"}
          for nome, url in (("GOOGLE", "https://news.google.com/rss/search?q=GTA%206&hl=en-US&gl=US&ceid=US:en"),
                            ("BING", "https://www.bing.com/news/search?q=GTA+6&format=rss&setlang=en-US"),
                            ("BING_IT", "https://www.bing.com/news/search?q=GTA+6&format=rss&setlang=it-IT&cc=IT")):
              try:
                  r = requests.get(url, headers=H, timeout=10)
                  print("====", nome, r.status_code, len(r.content), flush=True)
                  root = ET.fromstring(r.content)
                  for it in root.findall("./channel/item")[:4]:
                      d = it.findtext("description") or ""
                      print("T:", it.findtext("title"))
                      print("L:", (it.findtext("link") or "")[:160])
                      print("D:", html.unescape(re.sub("<[^>]+>", " ", d))[:400])
                      print("-", flush=True)
              except Exception as e:
                  print(nome, "ERRORE", e, flush=True)
          PY
